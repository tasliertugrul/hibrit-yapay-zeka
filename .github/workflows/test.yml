name: Test Hibrit App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - - name: Install tools
  run: |
    sudo apt-get update
    sudo apt-get install -y jq zenity || true
    pip install requests

    - name: Check Syntax (Bash and Python)
      run: |
        bash -n ai_hibrit.sh
        python -m py_compile gorsel_analiz.py
        echo "Tüm kodlar hatasız!"